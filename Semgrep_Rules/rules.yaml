rules:
  - id: c-cast-array-oob
    languages:
      - c
      - cpp
    message: >-
      High-risk out-of-bounds: array cast to different type but loop uses byte
      size.
    severity: ERROR
    patterns:
      - pattern: |
          $TYPE1 $ARR[$N];
          ...
          for ($INIT; $I < sizeof($ARR); $I++) {
            ...
            (($TYPE2*)$ARR)[$I] = $VAL;
          }

      - metavariable-regex:
          metavariable: $TYPE1
          regex: '^(?:unsigned |signed )?char$'

      - metavariable-regex:
          metavariable: $TYPE2
          regex: ^(?!char$).+

    metadata:
      category: security
      confidence: HIGH
      cwe:
        - CWE-119
        - CWE-787

  - id: c-unsafe-sprintf-buffer-overflow
    languages:
      - c
      - cpp
    message: >-
      Possible buffer overflow: sprintf does not check buffer bounds. Use
      snprintf instead.
    severity: ERROR
    patterns:
      - pattern: sprintf($BUF, $FMT, ...)
      - pattern-inside: |
          $TYPE $BUF[$SIZE];
    metadata:
      category: security
      cwe: CWE-119

  - id: c-unsafe-string-functions
    languages:
      - c
      - cpp
    message: Unsafe string handling function may cause buffer overflow.
    severity: WARNING
    pattern-either:
      - pattern: strcpy($DST, $SRC)
      - pattern: strcat($DST, $SRC)
      - pattern: gets($BUF)
      - pattern: sprintf($DST, ...)
    metadata:
      category: security
      cwe:
        - CWE-119
        - CWE-787

  ###########################################################################
  # Division by variable whose last visible assignment value is zero.
  ###########################################################################
  - id: c.division-by-zero.assigned-zero-variable
    languages:
      - c
      - cpp
    severity: ERROR
    message: >-
      Division or modulo by variable '$DIVISOR' whose last visible assignment
      value is zero.
    patterns:
      - pattern: |
          $DIVISOR = $ZERO;
          ...
          $USE;

      - metavariable-pattern:
          metavariable: $USE
          pattern-either:
            - pattern: $NUM / $DIVISOR
            - pattern: $NUM % $DIVISOR
            - pattern: $NUM /= $DIVISOR
            - pattern: $NUM %= $DIVISOR

      - pattern-not: |
          $DIVISOR = $ZERO;
          ...
          $DIVISOR = $OTHER;
          ...
          $USE;

      - metavariable-regex:
          metavariable: $ZERO
          regex: ^0(?:\.0+)?[fFlLuU]*$

    metadata:
      category: security
      confidence: high
      cwe:
        - CWE-369

  ###########################################################################
  # Division by variable whose last visible declaration value is zero.
  ###########################################################################
  - id: c.division-by-zero.declared-zero-variable
    languages:
      - c
      - cpp
    severity: ERROR
    message: >-
      Division or modulo by variable '$DIVISOR' whose last visible declared
      value is zero.
    patterns:
      - pattern: |
          $TYPE $DIVISOR = $ZERO;
          ...
          $USE;

      - metavariable-pattern:
          metavariable: $USE
          pattern-either:
            - pattern: $NUM / $DIVISOR
            - pattern: $NUM % $DIVISOR
            - pattern: $NUM /= $DIVISOR
            - pattern: $NUM %= $DIVISOR

      - pattern-not: |
          $TYPE $DIVISOR = $ZERO;
          ...
          $DIVISOR = $OTHER;
          ...
          $USE;

      - metavariable-regex:
          metavariable: $ZERO
          regex: ^0(?:\.0+)?[fFlLuU]*$

    metadata:
      category: security
      confidence: high
      cwe:
        - CWE-369

  ###########################################################################
  # Division by zero: literal zero divisor.
  ###########################################################################
  - id: c.division-by-zero.literal
    languages:
      - c
      - cpp
    severity: ERROR
    message: Division or modulo by literal zero.
    patterns:
      - pattern-either:
          - pattern: $NUM / $ZERO
          - pattern: $NUM % $ZERO
          - pattern: $NUM /= $ZERO
          - pattern: $NUM %= $ZERO

      - metavariable-regex:
          metavariable: $ZERO
          regex: ^0(?:\.0+)?[fFlLuU]*$

    metadata:
      category: security
      confidence: high
      cwe:
        - CWE-369

  ###########################################################################
  # Floating-point loop iterator can become zero in ascending loop.
  ###########################################################################
  - id: c.division-by-zero.loop-iterator-float-ascending
    languages:
      - c
      - cpp
    severity: WARNING
    message: >-
      Possible floating-point division by zero: loop iterator '$I' may become
      zero during this loop and is used as divisor.
    patterns:
      - pattern: |
          for ($FTYPE $I = $START; $COND; $I += $STEP) {
            ...
            $NUM / $I;
            ...
          }

      - metavariable-regex:
          metavariable: $FTYPE
          regex: ^(?:float|double)$

      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            - pattern: $I <= $END
            - pattern: $I < $END

      - metavariable-regex:
          metavariable: $START
          regex: ^-?[0-9]+(?:\.[0-9]+)?$

      - metavariable-regex:
          metavariable: $END
          regex: ^-?[0-9]+(?:\.[0-9]+)?$

      - metavariable-comparison:
          metavariable: $START
          comparison: float($START) <= 0.0

      - metavariable-comparison:
          metavariable: $END
          comparison: float($END) >= 0.0

    metadata:
      category: security
      confidence: medium
      cwe:
        - CWE-369

  ###########################################################################
  # Floating-point loop iterator can become zero in descending loop.
  ###########################################################################
  - id: c.division-by-zero.loop-iterator-float-descending
    languages:
      - c
      - cpp
    severity: WARNING
    message: >-
      Possible floating-point division by zero: loop iterator '$I' may become
      zero during this descending loop and is used as divisor.
    patterns:
      - pattern: |
          for ($FTYPE $I = $START; $COND; $I -= $STEP) {
            ...
            $NUM / $I;
            ...
          }

      - metavariable-regex:
          metavariable: $FTYPE
          regex: ^(?:float|double)$

      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            - pattern: $I >= $END
            - pattern: $I > $END

      - metavariable-regex:
          metavariable: $START
          regex: ^-?[0-9]+(?:\.[0-9]+)?$

      - metavariable-regex:
          metavariable: $END
          regex: ^-?[0-9]+(?:\.[0-9]+)?$

      - metavariable-comparison:
          metavariable: $START
          comparison: float($START) >= 0.0

      - metavariable-comparison:
          metavariable: $END
          comparison: float($END) <= 0.0

    metadata:
      category: security
      confidence: medium
      cwe:
        - CWE-369

  ###########################################################################
  # Integer loop iterator can become zero in ascending loop.
  ###########################################################################
  - id: c.division-by-zero.loop-iterator-int-ascending
    languages:
      - c
      - cpp
    severity: ERROR
    message: >-
      Possible division by zero: loop iterator '$I' can be zero during this
      ascending loop and is used as divisor.
    patterns:
      - pattern: |
          for ($TYPE $I = $START; $COND; $INC) {
            ...
            $USE;
            ...
          }

      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            - pattern: $I <= $END
            - pattern: $I < $END

      - metavariable-pattern:
          metavariable: $INC
          pattern-either:
            - pattern: $I++
            - pattern: ++$I

      - metavariable-pattern:
          metavariable: $USE
          pattern-either:
            - pattern: $NUM / $I
            - pattern: $NUM % $I

      - metavariable-regex:
          metavariable: $START
          regex: ^-?[0-9]+$

      - metavariable-regex:
          metavariable: $END
          regex: ^-?[0-9]+$

      - metavariable-comparison:
          metavariable: $START
          comparison: int($START) <= 0

      - metavariable-comparison:
          metavariable: $END
          comparison: int($END) >= 0

    metadata:
      category: security
      confidence: high
      cwe:
        - CWE-369

  ###########################################################################
  # Integer loop iterator can become zero in descending loop.
  ###########################################################################
  - id: c.division-by-zero.loop-iterator-int-descending
    languages:
      - c
      - cpp
    severity: ERROR
    message: >-
      Possible division by zero: loop iterator '$I' can be zero during this
      descending loop and is used as divisor.
    patterns:
      - pattern: |
          for ($TYPE $I = $START; $COND; $DEC) {
            ...
            $USE;
            ...
          }

      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            - pattern: $I >= $END
            - pattern: $I > $END

      - metavariable-pattern:
          metavariable: $DEC
          pattern-either:
            - pattern: $I--
            - pattern: --$I

      - metavariable-pattern:
          metavariable: $USE
          pattern-either:
            - pattern: $NUM / $I
            - pattern: $NUM % $I

      - metavariable-regex:
          metavariable: $START
          regex: ^-?[0-9]+$

      - metavariable-regex:
          metavariable: $END
          regex: ^-?[0-9]+$

      - metavariable-comparison:
          metavariable: $START
          comparison: int($START) >= 0

      - metavariable-comparison:
          metavariable: $END
          comparison: int($END) <= 0

    metadata:
      category: security
      confidence: high
      cwe:
        - CWE-369

  - id: c.fnh-might.free-stack-array-alias
    mode: taint
    languages:
      - c
      - cpp
    severity: WARNING
    message: >-
      Possible free of non-heap memory. This pointer may alias a local stack/static
      array and later be passed to free(). Only memory allocated by malloc(),
      calloc(), or realloc() should be released with free().
    metadata:
      cwe:
        - "CWE-590: Free of Memory not on the Heap"
      bug_type: "freeing possible non-heap memory"
      checker: "FNH.MIGHT"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      category: security
      technology:
        - c
        - cpp
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  {
                    ...
                    $ATYPE $ARR[$SIZE];
                    ...
                  }
              - pattern-inside: |
                  {
                    ...
                    $ATYPE $ARR[$SIZE] = ...;
                    ...
                  }
              - pattern-inside: |
                  {
                    ...
                    $ATYPE $ARR[] = ...;
                    ...
                  }
              - pattern-inside: |
                  {
                    ...
                    static $ATYPE $ARR[$SIZE];
                    ...
                  }
              - pattern-inside: |
                  {
                    ...
                    static $ATYPE $ARR[$SIZE] = ...;
                    ...
                  }
              - pattern-inside: |
                  {
                    ...
                    static $ATYPE $ARR[] = ...;
                    ...
                  }
          - pattern-either:
              - pattern: $PTYPE *$PTR = $RHS;
              - pattern: $PTR = $RHS;
          - metavariable-pattern:
              metavariable: $RHS
              pattern-either:
                - pattern: $ARR
                - pattern: '&$ARR[$IDX]'
          - focus-metavariable: $PTR
    pattern-sinks:
      - patterns:
          - pattern: free($PTR)
          - pattern-not: free(NULL)
          - pattern-not: free(nullptr)
          - focus-metavariable: $PTR
    pattern-sanitizers:
      - pattern-either:
          - pattern: malloc(...)
          - pattern: calloc(...)
          - pattern: realloc(...)
          - pattern: new $TYPE
          - pattern: new $TYPE(...)
          - pattern: new $TYPE[$SIZE]
          - pattern: "NULL"
          - pattern: nullptr

  - id: c.fum-gen-might.free-possibly-uninitialized-pointer
    languages:
      - c
      - cpp
    severity: WARNING
    message: >-
      Possible freeing of unallocated memory. The pointer appears to be declared
      without initialization and is only conditionally assigned before being passed
      to free(). If the allocation branch is not taken, free() may receive an
      uninitialized pointer, causing undefined behavior, heap corruption, or a
      crash.
    metadata:
      cwe:
        - "CWE-824: Access of Uninitialized Pointer"
        - "CWE-590: Free of Memory not on the Heap"
      checker: "FUM.GEN.MIGHT"
      bug_type: "freeing possibly unallocated or uninitialized memory"
      category: security
      technology:
        - c
        - cpp
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      precision: MEDIUM
      description: >-
        Detects local pointer variables that are declared without initialization,
        conditionally assigned heap memory, and then released with free() outside
        the conditional allocation path.
    patterns:
      - pattern: |
          $TYPE *$PTR;
          ...
          if ($COND) {
            ...
            $PTR = $ALLOC;
            ...
          }
          ...
          free($PTR);
      - metavariable-pattern:
          metavariable: $ALLOC
          pattern-either:
            - pattern: malloc(...)
            - pattern: calloc(...)
            - pattern: realloc($OLD, ...)

      # Safe: pointer is explicitly initialized before the conditional allocation.
      - pattern-not: |
          $TYPE *$PTR;
          ...
          $PTR = ...;
          ...
          if ($COND) {
            ...
            $PTR = $ALLOC;
            ...
          }
          ...
          free($PTR);

      # Safe: both branches assign the pointer.
      - pattern-not: |
          $TYPE *$PTR;
          ...
          if ($COND) {
            ...
            $PTR = ...;
            ...
          } else {
            ...
            $PTR = ...;
            ...
          }
          ...
          free($PTR);

  ###########################################################################
  # RN.INDEX - pointer arithmetic form
  ###########################################################################
  - id: c.rn-index.pointer-arithmetic-before-negative-check
    languages:
      - c
      - cpp
    severity: WARNING
    message: >-
      RN.INDEX: Offset/index '$IDX' is used in pointer arithmetic on '$BUF'
      before a later negative-value check. If '$IDX' can be negative, '$BUF +
      $IDX' may point before the buffer.
    metadata:
      checker: RN.INDEX
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      bug_type: suspicious pointer offset before negative check
      cwe:
        - "CWE-129: Improper Validation of Array Index"
        - "CWE-119: Improper Restriction of Operations within the Bounds of a Memory Buffer"
        - "CWE-125: Out-of-bounds Read"
        - "CWE-787: Out-of-bounds Write"
      technology:
        - c
        - cpp
    patterns:
      - pattern-either:
          # Assignment from pointer arithmetic.
          - pattern: |
              $PTR = $BUF + $IDX;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $TYPE *$PTR = $BUF + $IDX;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $PTR = $IDX + $BUF;
              ...
              if ($COND) {
                ...
              }

          # Pointer arithmetic passed to function/macro.
          - pattern: |
              $FUNC(..., $BUF + $IDX, ...);
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $FUNC(..., $IDX + $BUF, ...);
              ...
              if ($COND) {
                ...
              }

          # Dereference of pointer arithmetic.
          - pattern: |
              $VAL = *($BUF + $IDX);
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              *($BUF + $IDX) = $VAL;
              ...
              if ($COND) {
                ...
              }

      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            - pattern: $IDX < 0
            - pattern: $IDX <= -1
            - pattern: 0 > $IDX
            - pattern: -1 >= $IDX
            - pattern: $IDX < 0 || $OTHER
            - pattern: $OTHER || $IDX < 0
            - pattern: unlikely($IDX < 0)
            - pattern: WARN_ON($IDX < 0)

      # Suppress obvious prior reject checks.
      - pattern-not-inside: |
          if ($IDX < 0) return $VAL;
          ...
          $BUF + $IDX
      - pattern-not-inside: |
          if ($IDX < 0) goto $LABEL;
          ...
          $BUF + $IDX
      - pattern-not-inside: |
          if ($IDX < 0) return $VAL;
          ...
          $IDX + $BUF
      - pattern-not-inside: |
          if ($IDX < 0) goto $LABEL;
          ...
          $IDX + $BUF

      # Suppress obvious allow guard.
      - pattern-not-inside: |
          if ($IDX >= 0) {
            ...
            $BUF + $IDX
            ...
          }
      - pattern-not-inside: |
          if ($IDX >= 0) {
            ...
            $IDX + $BUF
            ...
          }

      - focus-metavariable: $IDX

  ###########################################################################
  # RN.INDEX - signed integer parameter, high-signal driver/helper form
  ###########################################################################
  - id: c.rn-index.signed-parameter-used-before-negative-check
    languages:
      - c
      - cpp
    severity: ERROR
    message: >-
      RN.INDEX: Signed integer parameter '$IDX' is used as an index before it is
      checked for being negative. Validate '$IDX >= 0' before using it in
      '$BUF[$IDX]'.
    metadata:
      checker: RN.INDEX
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      bug_type: signed index parameter used before negative check
      cwe:
        - "CWE-129: Improper Validation of Array Index"
        - "CWE-125: Out-of-bounds Read"
        - "CWE-787: Out-of-bounds Write"
      technology:
        - c
        - cpp
    patterns:
      - pattern-inside: |
          $RET $FUNC(..., $ITYPE $IDX, ...) {
            ...
          }

      - metavariable-regex:
          metavariable: $ITYPE
          regex: '^(?:signed\s+)?(?:int|short|long|long long|s8|s16|s32|s64|int8_t|int16_t|int32_t|int64_t|ssize_t|ptrdiff_t|loff_t|__s8|__s16|__s32|__s64)$'

      - pattern-either:
          - pattern: |
              $DST = $BUF[$IDX];
              ...
              if ($IDX < 0) {
                ...
              }
          - pattern: |
              $TYPE $DST = $BUF[$IDX];
              ...
              if ($IDX < 0) {
                ...
              }
          - pattern: |
              $BUF[$IDX] = $VAL;
              ...
              if ($IDX < 0) {
                ...
              }
          - pattern: |
              $CALL(..., $BUF[$IDX], ...);
              ...
              if ($IDX < 0) {
                ...
              }
          - pattern: |
              $CALL(..., &$BUF[$IDX], ...);
              ...
              if ($IDX < 0) {
                ...
              }

      # Suppress prior validation.
      - pattern-not-inside: |
          if ($IDX < 0) return $VAL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if ($IDX < 0) goto $LABEL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if ($IDX >= 0) {
            ...
            $BUF[$IDX]
            ...
          }

      - focus-metavariable: $IDX

  ###########################################################################
  # RN.INDEX
  # Index is used in an array/buffer access before a later negative check.
  ###########################################################################
  - id: c.rn-index.use-before-negative-check
    languages:
      - c
      - cpp
    severity: ERROR
    message: >-
      RN.INDEX: Index '$IDX' is used to access buffer/array '$BUF' before a
      later negative-value check. If '$IDX' can be negative, the access may read
      or write before the start of the buffer. Move the negative check before
      '$BUF[$IDX]'.
    metadata:
      checker: RN.INDEX
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      bug_type: suspicious use of index before negative check
      cwe:
        - "CWE-129: Improper Validation of Array Index"
        - "CWE-119: Improper Restriction of Operations within the Bounds of a Memory Buffer"
        - "CWE-125: Out-of-bounds Read"
        - "CWE-787: Out-of-bounds Write"
      technology:
        - c
        - cpp
      notes:
        - "Designed for C drivers/kernel-style code."
        - "Flags array/buffer index use before later idx < 0 style checks."
    patterns:
      - pattern-either:
          # Read from buffer.
          - pattern: |
              $DST = $BUF[$IDX];
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $TYPE $DST = $BUF[$IDX];
              ...
              if ($COND) {
                ...
              }

          # Write to buffer.
          - pattern: |
              $BUF[$IDX] = $VAL;
              ...
              if ($COND) {
                ...
              }

          # Compound writes.
          - pattern: |
              $BUF[$IDX] += $VAL;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $BUF[$IDX] -= $VAL;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $BUF[$IDX] |= $VAL;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $BUF[$IDX] &= $VAL;
              ...
              if ($COND) {
                ...
              }

          # Increment/decrement indexed slot.
          - pattern: |
              $BUF[$IDX]++;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              ++$BUF[$IDX];
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $BUF[$IDX]--;
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              --$BUF[$IDX];
              ...
              if ($COND) {
                ...
              }

          # Address of indexed element.
          - pattern: |
              $PTR = &$BUF[$IDX];
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $TYPE *$PTR = &$BUF[$IDX];
              ...
              if ($COND) {
                ...
              }

          # Indexed value passed to function/macro.
          - pattern: |
              $FUNC(..., $BUF[$IDX], ...);
              ...
              if ($COND) {
                ...
              }
          - pattern: |
              $FUNC(..., &$BUF[$IDX], ...);
              ...
              if ($COND) {
                ...
              }

          # Return indexed value before later negative check.
          - pattern: |
              return $BUF[$IDX];
              ...
              if ($COND) {
                ...
              }

      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            # Direct negative reject checks.
            - pattern: $IDX < 0
            - pattern: $IDX <= -1
            - pattern: 0 > $IDX
            - pattern: -1 >= $IDX

            # Combined reject checks with lower bound.
            - pattern: $IDX < 0 || $OTHER
            - pattern: $OTHER || $IDX < 0
            - pattern: $IDX <= -1 || $OTHER
            - pattern: $OTHER || $IDX <= -1
            - pattern: 0 > $IDX || $OTHER
            - pattern: $OTHER || 0 > $IDX

            # Common driver/helper wrappers.
            - pattern: unlikely($IDX < 0)
            - pattern: unlikely($IDX <= -1)
            - pattern: WARN_ON($IDX < 0)
            - pattern: WARN_ON($IDX <= -1)

      - pattern-not-inside: |
          if ($IDX < 0) return $VAL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if ($IDX <= -1) return $VAL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if (0 > $IDX) return $VAL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if ($IDX < 0) goto $LABEL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if ($IDX <= -1) goto $LABEL;
          ...
          $BUF[$IDX]
      - pattern-not-inside: |
          if (0 > $IDX) goto $LABEL;
          ...
          $BUF[$IDX]

      - pattern-not-inside: |
          if ($IDX >= 0) {
            ...
            $BUF[$IDX]
            ...
          }
      - pattern-not-inside: |
          if (0 <= $IDX) {
            ...
            $BUF[$IDX]
            ...
          }
      - pattern-not-inside: |
          if ($IDX > -1) {
            ...
            $BUF[$IDX]
            ...
          }

      - focus-metavariable: $IDX

  - id: cpp.fnh-might.delete-stack-array-alias
    mode: taint
    languages:
      - c
      - cpp
    severity: WARNING
    message: >-
      Possible delete/delete[] of non-heap memory. This pointer may alias a local
