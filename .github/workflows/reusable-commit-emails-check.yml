name: Commit Emails Check Reusable Workflow
on:
  workflow_call:  

permissions:
  contents: read
  
jobs:
  run-commit-emails-check:
    if: ${{ github.event_name == 'pull_request' }}
    name: Run Commit Emails Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run Commit Emails Check Action
        uses: qualcomm/commit-emails-check-action@46c3958ed716495bf05e03c6d1a6760969b948ff # v1.0.0
