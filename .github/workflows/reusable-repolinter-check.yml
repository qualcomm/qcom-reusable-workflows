name: Repolinter Check Reusable Workflow
on:
  workflow_call:
    inputs:
      repolint-config-path:
        description: "Path to a local repolinter ruleset override, relative to repo root"
        required: false
        type: string
        default: "repolint.json"

permissions:
  contents: read

jobs:
  run-repolinter-check:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: Run Repolinter Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repolinter config file is present
        id: check_files
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: "${{ inputs.repolint-config-path }}"
      - name: Run Repolinter with local repolint.json
        if: steps.check_files.outputs.files_exists == 'true'
        uses: todogroup/repolinter-action@4d478dcd860571382da7d512d6dc6dd5f554fbb2 # v1.7.3
        with:
          config_file: "${{ inputs.repolint-config-path }}"
      - name: Run Repolinter with default ruleset
        if: steps.check_files.outputs.files_exists == 'false'
        uses: todogroup/repolinter-action@4d478dcd860571382da7d512d6dc6dd5f554fbb2 # v1.7.3
        with:
          config_url: "https://raw.githubusercontent.com/qualcomm/.github/main/repolint.json"
