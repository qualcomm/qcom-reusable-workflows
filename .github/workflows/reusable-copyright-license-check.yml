name: Copyright License Check Reusable Workflow
on:
  workflow_call:

permissions:
  contents: read
  
jobs:
  run-copyright-license-check:
    # Public repositories use a PR-diff scan. A missing visibility value is
    # treated as public-compatible so the check is not silently skipped.
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.repository.visibility != 'internal' &&
      github.event.repository.visibility != 'private'
      }}
    name: Run Copyright License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # Full history so we can diff properly.
                            # On pull_request events, actions/checkout fetches
                            # refs/pull/N/merge whose parents are base.sha and
                            # head.sha — both are already present after this step.
         
 
      - name: Get base and head SHAs (from event payload, no token needed)
        id: shas
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Generate patch for PR changes only (GitHub PR-style 3-dot diff)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="origin/${BASE_REF}"
          HEAD="${HEAD_SHA}"

          # GitHub PRs show a three-dot diff: merge-base(base, head) -> head.
          # Using the live base branch tip (not the stale SHA from the event
          # payload) ensures the patch always matches the GitHub PR UI diff.

          git diff "${BASE}...${HEAD}" > pr.patch
          head -n 100 pr.patch

      - name: Run Copyright License Check Action
        uses: qualcomm/copyright-license-checker-action@ad0c1d22c71d85972d26ec2c72074faaad9bb0df
        with:
          patch_file: pr.patch
          repo_name: ${{ github.repository }}

  run-full-repo-scan:
    # Internal and private repos are held to the whole-repo standard on every event that can
    # carry code, so findings in files nobody touched still surface. Public repos get the
    # diff-based check above instead; exactly one of the two jobs runs per event.
    if: >-
      ${{
      (github.event.repository.visibility == 'internal' ||
      github.event.repository.visibility == 'private') &&
      ((github.event_name == 'pull_request' && github.event.action != 'closed') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
      }}
    name: Run Full-Repo Copyright and License Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Shallow checkout (the default fetch-depth of 1) is enough: the full scan
        # walks the working tree and never diffs, so no history is needed.
        uses: actions/checkout@v6

      - name: Run Full-Repo Copyright License Scan Action
        uses: qualcomm/copyright-license-checker-action/full-scan@full_files_scan
        with:
          repo_name: ${{ github.repository }}
          # Blocking. This sweep gates pull requests in internal/private repos and
          # covers pre-existing files, so legacy findings will fail the run too.
          fail_on_findings: 'true'
