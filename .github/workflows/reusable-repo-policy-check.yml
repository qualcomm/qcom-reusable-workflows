name: Test Repo Policy Action - SSHEDGE
on:
  workflow_call:     

permissions:
  contents: read
  
jobs:
  test-repo-policy-check:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    name: Run TestRepoPolicyCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify repolinter config file is present
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "repolint.json"
      - name: Run TestRepoPolicyCheck with local repolint.json
        if: steps.check_files.outputs.files_exists == 'true'
        uses: qualcomm/repo-policy-action@main
        with:
          config_file: "repolint.json"
      - name: Run TestRepoPolicyCheck with default ruleset
        if: steps.check_files.outputs.files_exists == 'false'
        uses: qualcomm/repo-policy-action@main
        with:
          config_url: "https://raw.githubusercontent.com/qualcomm/.github/main/repolint.json"
